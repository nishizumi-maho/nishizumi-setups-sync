[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nishizumi-sync"
description = "Synchronise iRacing setups between personal, team and supplier folders"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "nishizumi-maho" }]
keywords = ["iracing", "setups", "sync", "sim-racing"]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
gui = ["PySide6>=6.5"]
net = ["requests>=2.28"]
rar = ["rarfile>=4.0"]
all = ["PySide6>=6.5", "requests>=2.28", "rarfile>=4.0"]
dev = ["pytest>=7.4", "flake8>=6.0", "pyinstaller>=6.0"]

[project.urls]
Homepage = "https://github.com/nishizumi-maho/Nishizumi-Sync"
Issues = "https://github.com/nishizumi-maho/Nishizumi-Sync/issues"

[project.scripts]
nishizumi-sync = "nishizumi_sync.cli:main"

[tool.setuptools]
packages = ["nishizumi_sync", "nishizumi_sync.gui"]

[tool.setuptools.dynamic]
version = { attr = "nishizumi_sync.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.flake8]
max-line-length = 127
max-complexity = 15
exclude = [".git", "__pycache__", "build", "dist"]
